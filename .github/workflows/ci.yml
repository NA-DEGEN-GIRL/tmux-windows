name: Windows CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" -Force

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json', 'CMakeLists.txt') }}
          restore-keys: vcpkg-x64-windows-static-

      # vcpkg.json puts vcpkg in manifest mode: the toolchain installs the
      # dependencies during configure ("vcpkg install <pkg>" is an error).
      - name: Configure CMake
        shell: pwsh
        run: |
          # A release tag names the version tmux -V reports.
          $version = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          cmake -S . -B build -G "Visual Studio 17 2022" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DTMUX_VERSION="$version"

      - name: Build ${{ matrix.config }}
        shell: pwsh
        run: |
          cmake --build build --config ${{ matrix.config }}

      - name: Run native unit tests
        shell: pwsh
        run: |
          ctest --test-dir build -C ${{ matrix.config }} -L unit --output-on-failure

      # Every regress/win32-*.sh script, each under its own server label, so
      # no step needs to kill tmux processes by name.
      - name: Run regression tests
        shell: bash
        timeout-minutes: 45
        run: |
          TEST_TMUX=./build/${{ matrix.config }}/tmux.exe \
            TMUX_TEST_PREFIX=ci-${{ matrix.config }} \
            sh regress/win32-run-all.sh

      - name: Upload tested tmux.exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-windows-${{ matrix.config }}
          path: |
            build/${{ matrix.config }}/tmux.exe

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # Ship exactly the Release binary the tests ran against.
      - name: Download tested Release build
        uses: actions/download-artifact@v4
        with:
          name: tmux-windows-Release
          path: release-staging

      - name: Package release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "tmux-windows-$version.zip"
          $stagingDir = "release-staging"

          Compress-Archive -Path "$stagingDir/tmux.exe" -DestinationPath $zipName

          # Generate SHA256
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -Encoding ascii "$zipName.sha256"

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "ZIP_HASH=$hash" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          body: |
            ## tmux for Windows ${{ github.ref_name }}

            **SHA256:** `${{ env.ZIP_HASH }}`

            ### Installation
            1. Download `${{ env.ZIP_NAME }}`
            2. Extract to a folder in your `%PATH%`
            3. Run `tmux new-session`

            ### Requirements
            - Windows 10 version 1903+ (1809 works with limitations, see README_WIN32.MD)
            - Windows Terminal or VT-capable console

            ### What's included
            - `tmux.exe` (statically linked, single-file)

            See [README_WIN32.MD](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README_WIN32.MD) for full documentation.
          generate_release_notes: true
